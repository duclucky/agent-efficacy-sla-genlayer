<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <path d="M50 8 L85 24 V52 C85 74 50 92 50 92 C50 92 15 74 15 52 V24 L50 8 Z" fill="#0B0F19" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Neural / Circuit Nodes -->
  <circle cx="50" cy="32" r="4" fill="#34D399"/>
  <circle cx="34" cy="46" r="3.5" fill="#10B981"/>
  <circle cx="66" cy="46" r="3.5" fill="#10B981"/>
  <circle cx="50" cy="62" r="4" fill="#34D399"/>
  <line x1="50" y1="32" x2="34" y2="46" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="50" y1="32" x2="66" y2="46" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="34" y1="46" x2="50" y2="62" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="66" y1="46" x2="50" y2="62" stroke="#10B981" stroke-width="2" stroke-dasharray="2 2"/>
  <!-- Central Checkmark -->
  <path d="M42 50 L48 56 L60 42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
